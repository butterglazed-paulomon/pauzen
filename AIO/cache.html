<!DOCTYPE html>
<html manifest="offline.appcache" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
    <title>Paulomon Exploit Cache</title>
    <link rel="shortcut icon" href="favicon.ico">
    <style>
        @font-face {
            font-family: 'logging';
            src: url('fonts/LiberationMono-Regular.ttf');
        }
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            max-width: 520px;
            padding: 28px;
            background: rgba(15, 22, 33, 0.95);
            border: 1px solid rgba(57, 255, 20, 0.25);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8), 0 0 20px rgba(57, 255, 20, 0.1);
        }
        .hero {
            max-width: 80%;
            max-height: 220px;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0, 255, 102, 0.15);
            margin-bottom: 25px;
            border: 1px solid rgba(0, 255, 102, 0.2);
        }
        h1 {
            font-size: 22px;
            margin: 0 0 10px 0;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
        }
        .status-text {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #39ff14;
            letter-spacing: 0.5px;
            text-shadow: 0 0 8px rgba(57, 255, 20, 0.5);
            font-family: 'logging', monospace;
            min-height: 24px;
        }
        .progress-container {
            width: 350px;
            height: 10px;
            background-color: #1f2833;
            border-radius: 5px;
            overflow: hidden;
            margin: 0 auto;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
            border: 1px solid rgba(57, 255, 20, 0.2);
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #39ff14, #00ff88);
            box-shadow: 0 0 12px #39ff14;
            border-radius: 5px;
            transition: width 0.2s ease-out;
        }
        .subtitle {
            margin-top: 18px;
            font-size: 13px;
            color: #c5c6c7;
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="includes/assets/kexploit.png" class="hero" alt="PSFree Exploit Logo">
        <h1>Paulomon Exploit Installation</h1>
        <div id="status" class="status-text">Checking cache manifest...</div>
        <div class="progress-container">
            <div id="bar" class="progress-bar"></div>
        </div>
        <div class="subtitle" id="fw-info">@tinkeringwithPaulomon</div>
    </div>

    <script>
        var statusEl = document.getElementById('status');
        var barEl = document.getElementById('bar');
        var appCache = window.applicationCache;
        var finished = false;

        function goToIndex(message) {
            if (finished) return;
            finished = true;
            try { localStorage.setItem('aio_cache_ready', '1'); } catch (e) {}
            statusEl.textContent = message || 'Continuing to main application...';
            barEl.style.width = '100%';
            setTimeout(function () { window.location.replace('index.html'); }, 1500);
        }

        // Called on genuine cache failure — does NOT set aio_cache_ready so next visit retries.
        // Sets aio_cache_failed (sessionStorage) to prevent redirect loop within same session.
        function goFallback(reason) {
            if (finished) return;
            finished = true;
            try { sessionStorage.setItem('aio_cache_failed', '1'); } catch (e) {}
            statusEl.textContent = reason || 'Cache failed — continuing without cache...';
            statusEl.style.color = '#ff5f56';
            barEl.style.width = '0%';
            setTimeout(function () { window.location.replace('index.html'); }, 2500);
        }

        if (!appCache) {
            goToIndex('Cache ready (applicationCache not supported)');
        } else {
            appCache.addEventListener('checking', function () {
                statusEl.textContent = 'Checking cache manifest...';
            }, false);

            appCache.addEventListener('downloading', function () {
                statusEl.textContent = 'Downloading exploit assets...';
                barEl.style.width = '5%';
            }, false);

            appCache.addEventListener('progress', function (e) {
                if (e.lengthComputable && e.total > 0) {
                    var percent = Math.round((e.loaded / e.total) * 100);
                    statusEl.textContent = 'Installing exploit... ' + percent + '% (' + e.loaded + '/' + e.total + ')';
                    barEl.style.width = percent + '%';
                } else {
                    statusEl.textContent = 'Installing exploit assets...';
                    barEl.style.width = '50%';
                }
            }, false);

            appCache.addEventListener('cached', function () {
                goToIndex('Exploit Installed Successfully!');
            }, false);

            appCache.addEventListener('updateready', function () {
                try { appCache.swapCache(); } catch (e) {}
                goToIndex('Exploit Cache Updated Successfully!');
            }, false);

            appCache.addEventListener('noupdate', function () {
                goToIndex('Exploit Cache Already Installed');
            }, false);

            appCache.addEventListener('error', function () {
                var s = appCache.status;
                if (s === appCache.IDLE || s === appCache.UPDATEREADY) {
                    // Cache already populated — error was non-fatal, safe to proceed
                    if (s === appCache.UPDATEREADY) { try { appCache.swapCache(); } catch (e) {} }
                    goToIndex('Offline cache ready.');
                } else if (!navigator.onLine && s !== appCache.UNCACHED) {
                    // Offline but previously cached
                    goToIndex('Operating offline mode.');
                } else {
                    // True failure: quota exceeded, 404, or network error
                    goFallback('Cache failed (quota/network error) — retrying next visit...');
                }
            }, false);

            // Handle case where noupdate fired before listeners were registered
            if (appCache.status === appCache.IDLE || appCache.status === appCache.UPDATEREADY) {
                if (appCache.status === appCache.UPDATEREADY) {
                    try { appCache.swapCache(); } catch (e) {}
                }
                goToIndex('Exploit Cache Already Installed');
            }
        }

        // Safety fallback: if caching hangs for 45s, redirect without marking ready so next visit retries
        setTimeout(function () {
            goFallback('Cache timed out — retrying next visit...');
        }, 45000);
    </script>
</body>

</html>
